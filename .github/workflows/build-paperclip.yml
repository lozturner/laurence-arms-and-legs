name: Build paperclip.exe

on:
  push:
    branches:
      - claude/refocus-main-task-XsSmO
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pynput pystray pillow pywin32 psutil pyperclip mss uiautomation comtypes

      - name: Generate icon
        shell: pwsh
        run: python build_assets/make_icon.py

      - name: Build paperclip.exe (with version info + icon)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --windowed --name paperclip `
            --icon build_assets/paperclip.ico `
            --version-file build_assets/version_info.txt `
            --hidden-import pystray._win32 `
            --hidden-import PIL._tkinter_finder `
            --hidden-import comtypes `
            --hidden-import comtypes.stream `
            --collect-submodules uiautomation `
            --collect-submodules pystray `
            --collect-submodules pynput `
            paperclip.py

      - name: Compute SHA256
        id: hash
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/paperclip.exe -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item dist/paperclip.exe).Length
          echo "sha256=$h" >> $env:GITHUB_OUTPUT
          echo "size=$size" >> $env:GITHUB_OUTPUT
          echo "SHA256: $h"
          echo "Size:   $size bytes"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: paperclip-exe
          path: dist/paperclip.exe

      - name: Create / update release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: paperclip-latest
          name: paperclip (latest build)
          prerelease: false
          make_latest: true
          files: dist/paperclip.exe
          body: |
            # Paperclip — latest Windows build

            **Version:** 0.2.0
            **SHA256:** `${{ steps.hash.outputs.sha256 }}`
            **Size:** ${{ steps.hash.outputs.size }} bytes
            **Source commit:** ${{ github.sha }}

            ## How to download
            1. Click `paperclip.exe` in the **Assets** list below.
            2. Save it anywhere (Desktop is fine).

            ## How to run
            1. Double-click `paperclip.exe`.
            2. A small paperclip icon appears in your system tray.
            3. Triple-right-click anywhere to capture context.

            No Python install, no command line, no setup.

            ## About the SmartScreen warning

            The exe is unsigned (paid code-signing certs cost money). On first
            run Windows shows **"Windows protected your PC"** → click **More
            info** → **Run anyway**. That's normal for new free software.

            Want to verify it's the real build? Open PowerShell and run:
            ```powershell
            (Get-FileHash paperclip.exe -Algorithm SHA256).Hash
            ```
            It should match the SHA256 above.

            Want a second opinion? Drop the file on
            <https://www.virustotal.com/gui/home/upload> — every major
            antivirus engine scans it instantly, free.

            False positive in Windows Defender? Submit it here (free, takes
            a few days for the warning to clear globally):
            <https://www.microsoft.com/en-us/wdsi/filesubmission>

            ## Installing via Scoop (skips SmartScreen entirely)

            If you have [Scoop](https://scoop.sh):
            ```powershell
            scoop install https://raw.githubusercontent.com/lozturner/laurence-arms-and-legs/claude/refocus-main-task-XsSmO/scoop/paperclip.json
            ```
            Scoop is a trusted publisher to Windows, so no SmartScreen prompt.
